services:
  overseer-api:
    build: .
    environment:
      OVERSEER_API_HOST: 0.0.0.0
      OVERSEER_API_PORT: 8090
      OVERSEER_API_TOKEN: ${OVERSEER_API_TOKEN:-}
      OVERSEER_DB_URL: mysql+pymysql://overseer:${MYSQL_PASSWORD:-overseer}@mysql:3306/Overseer?charset=utf8mb4
      OVERSEER_CORS_ORIGINS: ${OVERSEER_CORS_ORIGINS:-*}
      OVERSEER_API_URL: http://127.0.0.1:8090
    ports:
      - "${OVERSEER_API_PORT:-8090}:8090"
    volumes:
      - ./pipelines:/app/pipelines
      - ./runtime:/app/runtime
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-overseer}
      MYSQL_DATABASE: Overseer
      MYSQL_USER: overseer
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-overseer}
    ports:
      - "${OVERSEER_DB_PORT:-3307}:3306"
    volumes:
      - overseer_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  overseer_mysql_data:
