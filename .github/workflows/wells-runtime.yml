# WELLS-GENERATED: wells-runtime
# Regenerar: node .agents/tools/wells-toolkit.mjs github --project . --apply
name: WELLS Runtime

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wells-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate project structure
        run: node .agents/tools/validate-project.mjs
      - name: Audit WELLS runtime
        run: node .agents/tools/wells-toolkit.mjs audit --project .
      - name: Validate Claude plugin
        run: node .agents/tools/validate-claude-plugin.mjs
      - name: Lint knowledge graph
        run: node .agents/tools/wells-toolkit.mjs knowledge lint --project .
