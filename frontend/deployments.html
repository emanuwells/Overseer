<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overseer - Ambiente</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="deployments">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><div class="brand-mark">O</div><div><strong>Overseer</strong><span>Ambiente API</span></div></a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a><a href="run-detail.html">Runs</a><a href="lineage.html">DAG</a><a aria-current="page" href="deployments.html">Ambiente</a>
      </nav>
      <div class="side-status"><small>Base de dados</small><div class="bar"><span data-db-bar style="width:0%"></span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">Overseer / Ambiente</div>
        <div class="actions">
          <input class="token-input" data-token-input type="password" placeholder="Token API">
          <button class="btn" data-token-save>Guardar</button>
          <button class="btn primary" data-refresh>Atualizar</button>
        </div>
      </header>
      <section class="content">
        <div class="hero-row"><div><h1>Ambiente</h1><p class="subhead">Estado da API, base de dados, heartbeats e triggers operacionais.</p></div><span class="pill" data-sync-state>A carregar</span></div>
        <div data-alert></div>
        <div class="kpis grid">
          <div class="card card-pad kpi"><span class="label">DB</span><div class="kpi-main"><span class="metric compact" data-db-mode>--</span><span class="delta" data-db-driver>--</span></div></div>
          <div class="card card-pad kpi"><span class="label">Pipelines</span><div class="kpi-main"><span class="metric" data-table-count="pipelines">--</span><span class="delta">tabela</span></div></div>
          <div class="card card-pad kpi"><span class="label">Nodes</span><div class="kpi-main"><span class="metric" data-table-count="pipeline_nodes">--</span><span class="delta">DAG</span></div></div>
          <div class="card card-pad kpi"><span class="label">Edges</span><div class="kpi-main"><span class="metric" data-table-count="pipeline_edges">--</span><span class="delta">DAG</span></div></div>
        </div>
        <div class="two-col grid">
          <section class="card">
            <div class="section-head"><div><h2>Heartbeats</h2><p data-count="heartbeats">--</p></div></div>
            <div class="alert-list" data-heartbeats></div>
          </section>
          <aside class="card">
            <div class="section-head"><div><h2>Triggers</h2><p data-count="triggers">--</p></div></div>
            <div class="alert-list" data-triggers></div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
