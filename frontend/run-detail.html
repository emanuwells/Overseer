<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overseer - Runs</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="runs">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><div class="brand-mark">O</div><div><strong>Overseer</strong><span>Runs e módulos</span></div></a>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a><a aria-current="page" href="run-detail.html">Runs</a><a href="lineage.html">DAG</a><a href="deployments.html">Ambiente</a>
      </nav>
      <div class="side-status"><small>Base de dados</small><div class="bar"><span data-db-bar style="width:0%"></span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">Overseer / Runs</div>
        <div class="actions">
          <input class="token-input" data-token-input type="password" placeholder="Token API">
          <button class="btn" data-token-save>Guardar</button>
          <button class="btn primary" data-refresh>Atualizar</button>
        </div>
      </header>
      <section class="content">
        <div class="hero-row"><div><h1>Runs</h1><p class="subhead">Histórico operacional, módulos registados e logs por pipeline.</p></div><span class="pill" data-sync-state>A carregar</span></div>
        <div data-alert></div>
        <div class="two-col grid">
          <section class="card">
            <div class="section-head"><div><h2>Últimas runs</h2><p data-count="runs">--</p></div></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Run</th><th>Pipeline</th><th>Estado</th><th>Início</th><th>Duração</th></tr></thead>
                <tbody data-runs></tbody>
              </table>
            </div>
          </section>
          <aside class="card">
            <div class="section-head"><div><h2 data-run-title>Detalhe</h2><p data-run-subtitle>Seleção automática da run mais recente</p></div></div>
            <div class="stack">
              <div class="card-pad inspector" data-run-detail></div>
              <div>
                <h3>Módulos</h3>
                <div class="alert-list" data-run-modules></div>
              </div>
              <div>
                <h3>Logs</h3>
                <div class="log-list" data-run-logs></div>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
