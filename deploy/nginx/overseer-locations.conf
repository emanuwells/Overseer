# Overseer — proxy da API e SPA em /Overseer/ para hosts multi-aplicação.
#
# Incluir DENTRO do server block principal:
#
#   include /etc/nginx/overseer-locations.conf;
#
# O frontend estático fica em /usr/share/nginx/html/Overseer (ver
# scripts/deploy-nginx-frontend.sh).
#
# Nota: usar `root` (não `alias`) para o fallback SPA funcionar em rotas
# profundas como /Overseer/operations.

location /Overseer/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /Overseer/index.html;
}

location = /Overseer {
    return 301 /Overseer/;
}

location /v1/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
