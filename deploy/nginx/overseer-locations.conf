# Overseer — proxy da API para o frontend servido pelo nginx do host.
#
# Para hosts com nginx multi-aplicação (um único server block com root no web
# root partilhado), inclua este ficheiro DENTRO do server block:
#
#   include /etc/nginx/overseer-locations.conf;
#
# O frontend estático fica em /usr/share/nginx/html/Overseer e é servido pelo
# location / existente. Só falta encaminhar /v1 para a API (Docker em loopback).
location /v1/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
