# Overseer — frontend estático em /Overseer/ e proxy da API em /v1/.
#
# O frontend faz fetch para /v1/* a partir da raiz do host, por isso o nginx
# tem de encaminhar /v1/ para a API (Docker em 127.0.0.1:8090). A UI é servida
# a partir de /usr/share/nginx/html/Overseer.
#
# Instalar como site nginx (ver scripts/deploy-nginx-frontend.sh) e recarregar.
server {
    listen 80;
    server_name _;

    # Frontend estático (SPA React). `root` + try_files para deep links.
    location /Overseer/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /Overseer/index.html;
    }

    location = /Overseer {
        return 301 /Overseer/;
    }

    # API Overseer (Docker, apenas em loopback).
    location /v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
