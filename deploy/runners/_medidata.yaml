# Template Medidata — NÃO é auto-detectado (prefixo _).
# Na máquina Windows Medidata, criar o catálogo com o hostname real:
#   .\scripts\windows\new-host-catalog.ps1 -Template _medidata.yaml
# Isto gera deploy/runners/<HOSTNAME>.yaml a partir deste template.

pipelines:
  - id: medidata_pipeline
    name: Medidata Pipeline
    owner: data
    criticality: medium
    schedule: manual
    task_match: "run_pipeline.py"
    log: "C:\\MAIATRON\\Medidata_Pipeline\\pipeline\\overseer_run.log"
    steps:
      - module_id: run_pipeline
        command:
          - "C:\\Users\\DQSI\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"
          - "run_pipeline.py"
        cwd: "C:\\MAIATRON\\Medidata_Pipeline\\pipeline"
