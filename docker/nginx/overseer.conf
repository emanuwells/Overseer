server {
    listen 80;
    server_name _;

    location /v1/ {
        proxy_pass http://overseer-api:8090/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
        proxy_pass http://overseer-api:8090/docs;
    }

    location /ui/ {
        proxy_pass http://overseer-api:8090/ui/;
    }
}
